<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="webflow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="selfhost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27ae60"/>
      <stop offset="100%" stop-color="#1e8449"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="320" rx="12" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Annual Hosting Cost</text>

  <!-- Grid lines -->
  <line x1="100" y1="60" x2="100" y2="250" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="100" y1="250" x2="540" y2="250" stroke="#ccc" stroke-width="1.5"/>
  <line x1="100" y1="155" x2="540" y2="155" stroke="#e0e0e0" stroke-width="0.5" stroke-dasharray="6,4"/>
  <line x1="100" y1="60" x2="540" y2="60" stroke="#e0e0e0" stroke-width="0.5" stroke-dasharray="6,4"/>

  <!-- Y-axis labels -->
  <text x="90" y="254" text-anchor="end" font-size="12" fill="#888">$0</text>
  <text x="90" y="159" text-anchor="end" font-size="12" fill="#888">$150</text>
  <text x="90" y="64" text-anchor="end" font-size="12" fill="#888">$300</text>

  <!-- Webflow bar -->
  <rect x="160" y="75" width="120" height="175" rx="6" fill="url(#webflow)" filter="url(#shadow)"/>
  <text x="220" y="105" text-anchor="middle" font-size="22" font-weight="700" fill="white">$276</text>
  <text x="220" y="125" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.85)">/year</text>

  <!-- Self-hosted bar -->
  <rect x="360" y="213" width="120" height="37" rx="6" fill="url(#selfhost)" filter="url(#shadow)"/>
  <text x="420" y="200" text-anchor="middle" font-size="22" font-weight="700" fill="#1e8449">$58/year</text>

  <!-- Labels -->
  <text x="220" y="275" text-anchor="middle" font-size="14" font-weight="600" fill="#555">Webflow</text>
  <text x="420" y="275" text-anchor="middle" font-size="11" font-weight="600" fill="#555">Next.js + Self-hosted Strapi</text>

  <!-- Savings callout -->
  <rect x="390" y="60" width="150" height="50" rx="25" fill="#27ae60" filter="url(#shadow)"/>
  <text x="465" y="80" text-anchor="middle" font-size="16" font-weight="700" fill="white">79% savings</text>
  <text x="465" y="98" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.9)">$218 saved per year</text>
</svg>
